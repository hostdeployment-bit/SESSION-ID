
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=0.8, user-scalable=no" />
<title>POPKID XD SESSIONS</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a2e0da6e4c.js" crossorigin="anonymous"></script>

<style>

:root{
  --gold:#d4af37;
  --gold-light:#ffe38a;
  --gold-dim:rgba(212,175,55,0.14);

  --red:#ff004c;
  --deep-red:#8b0000;

  --purple:#7b2ff7;
  --blue:#00c6ff;
  --cyan:#00ffe0;

  --black:#040404;
  --glass:rgba(255,255,255,0.04);
}

*,
*::before,
*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Rajdhani',sans-serif;
  background:
    radial-gradient(circle at top left, rgba(123,47,247,0.16), transparent 35%),
    radial-gradient(circle at bottom right, rgba(0,198,255,0.14), transparent 35%),
    radial-gradient(circle at center, rgba(255,0,76,0.08), transparent 40%),
    #040404;

  color:var(--gold);

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow-x:hidden;
  position:relative;

  padding:40px 16px;
}

/* Aurora */
body::before{
  content:'';
  position:fixed;
  inset:-20%;

  background:
    radial-gradient(circle at 20% 20%, rgba(255,0,85,0.14), transparent 25%),
    radial-gradient(circle at 80% 30%, rgba(0,198,255,0.14), transparent 25%),
    radial-gradient(circle at 40% 80%, rgba(123,47,247,0.14), transparent 25%);

  filter:blur(70px);

  animation:aurora 16s linear infinite alternate;

  z-index:0;
  pointer-events:none;
}

@keyframes aurora{
  from{
    transform:translateX(-30px) translateY(-15px) scale(1);
  }
  to{
    transform:translateX(30px) translateY(20px) scale(1.08);
  }
}

/* Noise */
body::after{
  content:'';
  position:fixed;
  inset:0;

  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");

  opacity:.45;
  pointer-events:none;
  z-index:1;
}

/* Floating particles */
.particles span{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:rgba(255,255,255,.45);

  animation:float 12s linear infinite;
}

.particles span:nth-child(1){ left:10%; top:100%; animation-duration:13s; }
.particles span:nth-child(2){ left:30%; top:95%; animation-duration:10s; }
.particles span:nth-child(3){ left:50%; top:100%; animation-duration:14s; }
.particles span:nth-child(4){ left:70%; top:96%; animation-duration:9s; }
.particles span:nth-child(5){ left:85%; top:100%; animation-duration:11s; }

@keyframes float{
  from{
    transform:translateY(0) scale(.5);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  to{
    transform:translateY(-110vh) scale(1.2);
    opacity:0;
  }
}

/* MAIN */
.main-content{
  position:relative;
  z-index:5;

  width:95%;
  max-width:720px;

  padding:55px 44px;

  border-radius:30px;

  overflow:hidden;

  animation:fadeUp .8s cubic-bezier(.22,1,.36,1);
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* Animated border */
.main-content::before{
  content:'';
  position:absolute;

  width:180%;
  height:180%;

  background:
    conic-gradient(
      transparent,
      var(--gold),
      transparent,
      var(--cyan),
      transparent,
      var(--purple),
      transparent
    );

  animation:spin 9s linear infinite;

  top:-40%;
  left:-40%;

  z-index:-2;
}

.main-content::after{
  content:'';
  position:absolute;
  inset:2px;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.05),
      rgba(255,255,255,0.015)
    );

  backdrop-filter:blur(20px) saturate(1.5);

  border:1px solid rgba(255,255,255,0.06);

  z-index:-1;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* Decorative glow line */
.glow-line{
  position:absolute;
  top:0;
  left:10%;
  right:10%;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--cyan),
      var(--gold),
      transparent
    );
}

/* Corners */
.corner{
  position:absolute;
  width:28px;
  height:28px;
  border-style:solid;
  border-color:rgba(255,255,255,.35);
  z-index:3;
}

.corner.tl{
  top:14px;
  left:14px;
  border-width:2px 0 0 2px;
}

.corner.tr{
  top:14px;
  right:14px;
  border-width:2px 2px 0 0;
}

.corner.bl{
  bottom:14px;
  left:14px;
  border-width:0 0 2px 2px;
}

.corner.br{
  bottom:14px;
  right:14px;
  border-width:0 2px 2px 0;
}

/* Logo */
.logo{
  display:flex;
  justify-content:center;
  margin-bottom:24px;
}

.logo-ring{
  position:relative;
  width:105px;
  height:105px;
}

.logo-ring::before{
  content:'';
  position:absolute;
  inset:-5px;

  border-radius:50%;

  background:
    conic-gradient(
      var(--gold),
      var(--cyan),
      var(--purple),
      var(--red),
      var(--gold)
    );

  animation:spin 6s linear infinite;
}

.logo-ring::after{
  content:'';
  position:absolute;
  inset:-2px;

  border-radius:50%;
  background:#080808;
}

.logo img{
  position:relative;
  z-index:2;

  width:105px;
  height:105px;

  border-radius:50%;
  object-fit:cover;

  box-shadow:
    0 0 35px rgba(0,198,255,0.22),
    0 0 45px rgba(255,0,85,0.15);
}

/* Title */
h1{
  text-align:center;

  font-family:'Cinzel',serif;
  font-size:clamp(1.6rem,5vw,2.6rem);
  font-weight:900;

  letter-spacing:.08em;

  margin-bottom:28px;

  background:
    linear-gradient(
      90deg,
      #fff,
      var(--gold-light),
      #ff5ea8,
      var(--cyan)
    );

  background-size:300% auto;

  animation:textGlow 8s linear infinite;

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

@keyframes textGlow{
  to{
    background-position:300% center;
  }
}

/* Status bar */
.status-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;

  margin-bottom:32px;

  padding:14px 18px;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.04),
      rgba(255,255,255,0.02)
    );

  border:1px solid rgba(255,255,255,0.06);

  font-weight:700;
  font-size:.88rem;

  letter-spacing:.08em;
  text-transform:uppercase;

  color:rgba(255,255,255,.75);

  backdrop-filter:blur(12px);
}

/* Sections */
.section{
  position:relative;

  margin-bottom:24px;

  padding:30px 26px;

  border-radius:18px;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.04),
      rgba(255,255,255,0.015)
    );

  border:1px solid rgba(255,255,255,0.06);

  transition:.35s ease;
}

.section::before{
  content:'';
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      var(--cyan),
      transparent
    );
}

.section:hover{
  transform:translateY(-3px);

  box-shadow:
    0 15px 40px rgba(0,198,255,0.08),
    0 0 40px rgba(123,47,247,0.08);

  border-color:rgba(255,255,255,0.12);
}

.section h3{
  display:flex;
  align-items:center;
  gap:12px;

  margin-bottom:22px;

  font-family:'Cinzel',serif;
  font-size:1.05rem;
  font-weight:700;

  letter-spacing:.12em;
  text-transform:uppercase;

  color:#fff;
}

.section h3 i{
  background:
    linear-gradient(
      135deg,
      var(--gold-light),
      #ff5ea8,
      var(--cyan)
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* Buttons */
.btn-grid{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;
}

.btn{
  position:relative;

  padding:14px 30px;

  border:none;
  border-radius:14px;

  cursor:pointer;
  overflow:hidden;

  color:white;

  font-family:'Rajdhani',sans-serif;
  font-size:1rem;
  font-weight:800;

  letter-spacing:.08em;
  text-transform:uppercase;

  background:
    linear-gradient(
      135deg,
      #ff0055,
      #7b2ff7,
      #00c6ff
    );

  background-size:300% auto;

  animation:btnFlow 7s linear infinite;

  transition:.3s ease;

  box-shadow:
    0 10px 30px rgba(123,47,247,0.25),
    0 0 30px rgba(0,198,255,0.12);
}

@keyframes btnFlow{
  to{
    background-position:300% center;
  }
}

.btn:hover{
  transform:translateY(-3px) scale(1.02);

  box-shadow:
    0 15px 40px rgba(123,47,247,0.35),
    0 0 40px rgba(0,198,255,0.18);
}

.btn:active{
  transform:scale(.97);
}

.btn::before{
  content:'';
  position:absolute;

  top:0;
  left:-120%;

  width:60%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.25),
      transparent
    );

  transition:.6s;
}

.btn:hover::before{
  left:150%;
}

.btn span{
  position:relative;
  z-index:2;
}

/* Footer */
.footer{
  margin-top:34px;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;

  text-align:center;

  color:rgba(255,255,255,.45);

  font-size:.84rem;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.footer-divider{
  width:80px;
  height:2px;

  border-radius:20px;

  margin-bottom:10px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      var(--cyan),
      transparent
    );
}

/* Pulse */
.pulse-dot{
  display:inline-block;

  width:8px;
  height:8px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:0 0 10px #22c55e;

  animation:pulseDot 2s ease-in-out infinite;

  margin-right:6px;
}

@keyframes pulseDot{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.4;
    transform:scale(.7);
  }
}

/* Mobile */
@media(max-width:600px){

  .main-content{
    padding:42px 22px;
  }

  .status-bar{
    flex-direction:column;
    align-items:flex-start;
  }

  .btn{
    width:100%;
  }

  .btn-grid{
    flex-direction:column;
  }

  h1{
    font-size:1.8rem;
  }
}

</style>
</head>

<body>

<!-- particles -->
<div class="particles">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>

<div class="main-content">

  <div class="glow-line"></div>

  <!-- corners -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Logo -->
  <div class="logo">
    <div class="logo-ring">
      <img src="https://files.catbox.moe/j9ia5c.png" alt="POPKID Logo">
    </div>
  </div>

  <!-- Title -->
  <h1>POPKID XMD 2026</h1>

  <!-- Status -->
  <div class="status-bar">

    <div id="time">
      <span class="pulse-dot"></span>
      <span id="time-val"></span>
    </div>

    <div id="date"></div>

    <div id="battery-status">
      <i class="fas fa-battery-full"></i>
    </div>

  </div>

  <!-- Pair Section -->
  <div class="section">

    <h3>
      <i class="fas fa-link"></i>
      Get Session ID
    </h3>

    <div class="btn-grid">

      <button class="btn" onclick="window.open('/pair')">
        <span>Pair Code</span>
      </button>

    </div>

  </div>

  <!-- Dev Section -->
  <div class="section">

    <h3>
      <i class="fas fa-users"></i>
      Developer & Community
    </h3>

    <div class="btn-grid">

      <button class="btn"
        onclick="window.open('https://github.com/popkidmain')">

        <span>GitHub</span>

      </button>

      <button class="btn"
        onclick="window.open('https://whatsapp.com/channel/0029Vb70ySJHbFV91PNKuL3T')">

        <span>WhatsApp Channel</span>

      </button>

    </div>

  </div>

  <!-- Footer -->
  <div class="footer">

    <div class="footer-divider"></div>

    <div>Made with passion by popkid</div>

    <div>By popkidprojects ❤️‍🩹</div>

  </div>

</div>

<script>

function updateTime() {

  const time = new Date();

  document.getElementById('time-val').textContent =
    time.toLocaleTimeString();

  document.getElementById('date').textContent =
    time.toLocaleDateString(undefined, {
      weekday:'short',
      month:'short',
      day:'numeric',
      year:'numeric'
    });
}

/* Battery */
function updateBatteryStatus() {

  if (navigator.getBattery) {

    navigator.getBattery().then(function(battery) {

      function refreshBattery() {

        let level = Math.round(battery.level * 100);

        let icon = "fa-battery-empty";

        if (level > 80) icon = "fa-battery-full";
        else if (level > 60) icon = "fa-battery-three-quarters";
        else if (level > 40) icon = "fa-battery-half";
        else if (level > 20) icon = "fa-battery-quarter";

        document.getElementById('battery-status').innerHTML =
          `<i class="fas ${icon}"></i> ${level}% ${battery.charging ? '| Charging' : ''}`;
      }

      refreshBattery();

      battery.addEventListener('levelchange', refreshBattery);
      battery.addEventListener('chargingchange', refreshBattery);

    });
  }
}

setInterval(updateTime,1000);

updateTime();
updateBatteryStatus();

</script>

</body>
</html>
